<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WALM Firtacher</title>

    <style>
        /* 1. Базовая настройка страницы */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #000; /* Черный фон */
            overflow: hidden;       /* Убираем полосы прокрутки */
            display: flex;
            justify-content: center; /* Центрируем всё по горизонтали */
            align-items: center;     /* Центрируем всё по вертикали */
        }

        /* 2. Контейнер, который держит и картинку, и список */
        .launcher-container {
            position: relative; /* ЭТО КРИТИЧНО! Список будет позиционироваться ОТНОСИТЕЛЬНО этого блока */
            height: 100vh;      /* Высота контейнера — на весь экран */
            width: auto;        /* Ширина подстроится под картинку */
            display: inline-block; /* Чтобы контейнер не схлопывался */
        }

        /* 3. Твоя картинка (растянутая по высоте) */
        .background-img {
            height: 100%;       /* Растягиваем строго по высоте контейнера */
            width: auto;        /* Ширина пропорционально */
            display: block;
        }

        /* 4. ТВОЙ СПИСОК (Накладывается сверху) */
        .overlay-list {
            position: absolute; /* ВЫРЫВАЕМ ИЗ ПОТОКА */
            
            /* Координаты наложения (подгони под свой макет) */
            top: 29%;           /* 20% от верха картинки */
            right: 7%;         /* 10% от правого края картинки */
            
            /* Размеры рамки */
            width: 456px;       /* Ширина рамки */
            height: 400px;      /* Высота рамки */
            
            /* Стили рамки (твои) */
            border: 2px solid #000; /* Белая рамка */
            background-color: rgba(0, 0, 0, 0.8); /* Черный фон, чуть прозрачный, чтобы видна была картинка */
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;          /* Отступ между кнопками */
            overflow-y: auto;   /* Прокрутка, если кнопок много */
            box-sizing: border-box; /* Чтобы padding не ломал размеры */
            z-index: 10;        /* Гарантирует, что список ТОЧНО сверху */
        }

        .list-btn {
            background-color: #000;  /* Чистый черный фон */
            color: #fff;            /* Белый цвет текста — СТРОГО ЭТО СВОЙСТВО */
            border: 1px solid #fff;  /* Белая рамка */
            padding: 12px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            text-transform: uppercase;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            display: block;         /* Чтобы кнопки шли друг под другом */
            width: 100%;            /* Чтобы занимали всю ширину рамки */
            margin-bottom: 5px;      /* Небольшой отступ между кнопками */
        }

        /* Эффект при наведении — инверсия */
        .list-btn:hover {
            background-color: #fff; /* Фон становится белым */
            color: #000;           /* Текст становится черным */
        }
    </style>
</head>
